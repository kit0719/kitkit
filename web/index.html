<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KitKit · the best smart b game</title>
  <style>
    :root {
      --osu-pink: #ff66aa;
      --osu-dark: #1a1a1a;
      --osu-darker: #111111;
      --osu-bg: #0d0d0d;
      --osu-text: #e1e1e1;
      --font-sf: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: var(--osu-bg);
      color: var(--osu-text);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      font-family: var(--font-sf);
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    /* ── Original Top Navigation Bar ── */
    .top-nav {
      width: 100%;
      max-width: 900px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 30px;
      gap: 16px;
      margin-top: 3px;
    }
    .nav-left { display: flex; align-items: center; gap: 16px; }
    .signin-btn {
      background: transparent; border: 1px solid #444; color: #ddd;
      padding: 8px 18px; border-radius: 8px; cursor: pointer;
      font-weight: 600; font-size: 0.85rem; transition: 0.2s;
    }
    .signin-btn:hover { border-color: var(--osu-pink); color: var(--osu-pink); }
    .money-badge {
      font-size: 0.9rem; color: #00dfc0; background: #222;
      padding: 6px 16px; border-radius: 20px; display: flex;
      align-items: center; gap: 6px; font-weight: 600;
    }
    .money-badge svg { width: 18px; height: 18px; }

    .nav-right { display: flex; gap: 12px; }
    .nav-icon {
      position: relative; background: transparent; border: 1px solid #444;
      color: #ddd; width: 44px; height: 44px; border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; transition: 0.2s;
    }
    .nav-icon svg { width: 20px; height: 20px; }
    .nav-icon:hover { border-color: var(--osu-pink); color: var(--osu-pink); background: rgba(255, 102, 170, 0.1); }
    .nav-icon::after {
      content: attr(data-tooltip); position: absolute; bottom: -28px; left: 50%;
      transform: translateX(-50%); background: #333; color: #eee; padding: 4px 10px;
      border-radius: 6px; font-size: 0.75rem; white-space: nowrap; opacity: 0;
      pointer-events: none; transition: opacity 0.2s; z-index: 10;
    }
    .nav-icon:hover::after { opacity: 1; }

    /* ── Main Hero Layout ── */
    .main-content {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      max-width: 900px;
      padding-bottom: 80px;
    }

    .hero-container {
      display: flex;
      width: 100%;
      align-items: center;
      justify-content: space-between;
      gap: 40px;
      padding: 0 40px;
    }

    /* Left Side: KitKit Logo & Buttons */
    .hero-left {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
    }

    .hero-title-img {
      width: 100%;
      max-width: 400px; 
      margin-bottom: 40px;
      object-fit: contain;
    }

    /* Mode Buttons (Dark Squares) */
    .mode-buttons { display: flex; gap: 24px; }

    .mode-btn {
      width: 180px;
      height: 180px;
      background: #141414;
      border: 2px solid #222;
      border-radius: 28px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      color: #fff;
    }

    .mode-btn:hover {
      border-color: var(--osu-pink); transform: translateY(-6px);
      box-shadow: 0 12px 30px rgba(255, 102, 170, 0.3); color: var(--osu-pink);
    }

    .mode-btn svg { width: 44px; height: 44px; }
    .mode-btn span { font-size: 1.1rem; font-weight: 700; }

    /* Right Side: Mascot Illustration */
    .hero-right {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: flex-end;
    }

    .kitu {
      height: 450px; 
      object-fit: contain;
      padding-right: 50px;
    }

    /* ── Size Selection Modal (Old index.html Layout + New Button Style) ── */
    /* ── Updated Modal Transitions ── */
    .modal-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.85); 
      display: flex;             /* Always flex, but controlled by visibility */
      align-items: center; justify-content: center; z-index: 1000;
      backdrop-filter: blur(8px);
      
      /* Transition properties */
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ;
    }

    /* When active, fade in the background */
    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .size-modal {
      background: var(--osu-dark); border-radius: 24px; padding: 40px 30px;
      max-width: 500px; width: 90%; text-align: center;
      box-shadow: 0 20px 40px rgba(0,0,0,0.7); border-top: 4px solid var(--osu-pink);
    }

    /* When parent is active, scale the modal to normal size */
    .modal-overlay.active .size-modal {
      transform: scale(1);
    }

    .size-modal h2 { 
      font-size: 1.5rem; 
      margin-bottom: 30px; 
      color: #fff; 
    }

    .size-grid { 
      display: grid; 
      grid-template-columns: repeat(4, 1fr); 
      gap: 16px; 
      margin-bottom: 30px; 
    }

    .size-option {
      aspect-ratio: 1 / 1; background: #222; border: 2px solid #333; border-radius: 16px;
      display: flex; align-items: center; justify-content: center; font-size: 1.4rem;
      font-weight: 700; color: #ddd; cursor: pointer; transition: all 0.2s;
    }
    .size-option:hover { border-color: var(--osu-pink); color: #fff; background: #2a2a2a; transform: scale(1.05); }
    .size-option.selected { border-color: var(--osu-pink); background: rgba(255, 102, 170, 0.2); color: var(--osu-pink); }

    .modal-buttons {
      display: flex;
      justify-content: center;
      gap: 16px;
    }

    .modal-close-btn {
      background: transparent; border: 1px solid #555; color: #aaa;
      padding: 16px 24px; border-radius: 14px; font-weight: 700; 
      font-size: 1.1rem; cursor: pointer; transition: 0.2s;
    }
    .modal-close-btn:hover { border-color: var(--osu-pink); color: var(--osu-pink); }

    .btn-start {
      background: var(--osu-pink); color: #fff;
      border: none; padding: 16px 36px; border-radius: 14px;
      font-size: 1.1rem; font-weight: 800; cursor: pointer;
      transition: transform 0.2s, opacity 0.2s;
    }
    .btn-start:disabled { opacity: 0.3; cursor: not-allowed; }
    .btn-start:not(:disabled):hover { transform: scale(1.02); filter: brightness(1.1); }
    .auth-box {
      background: var(--osu-dark); border-radius: 20px; padding: 32px;
      max-width: 400px; width: 90%; position: relative; border-top: 4px solid var(--osu-pink);
      box-shadow: 0 20px 40px rgba(0,0,0,0.7);
    }
    .auth-tabs { display: flex; gap: 12px; margin-bottom: 24px; }
    .auth-tab {
      flex: 1; background: transparent; border: none; color: #888; font-size: 1.1rem;
      font-weight: 700; padding-bottom: 12px; cursor: pointer; border-bottom: 2px solid #333;
      transition: 0.2s;
    }
    .auth-tab.active { color: var(--osu-pink); border-bottom-color: var(--osu-pink); }
    .auth-input {
      width: 100%; background: #111; border: 2px solid #333; color: #fff;
      padding: 14px 16px; border-radius: 12px; font-size: 1rem; margin-bottom: 16px;
      outline: none; transition: 0.2s; font-family: var(--font-sf);
    }
    .auth-input:focus { border-color: var(--osu-pink); }
    .auth-submit {
      width: 100%; background: var(--osu-pink); color: #fff; border: none;
      padding: 14px; border-radius: 12px; font-size: 1.1rem; font-weight: 700;
      cursor: pointer; transition: 0.2s; margin-top: 8px; font-family: var(--font-sf);
    }
    .auth-submit:hover { filter: brightness(1.1); transform: translateY(-2px); }
    .auth-error { color: #ff4d4d; font-size: 0.9rem; margin-bottom: 12px; text-align: center; min-height: 20px;}
    .user-profile-btn {
      background: rgba(255,102,170,0.1); border: 1px solid var(--osu-pink);
      color: var(--osu-pink); padding: 8px 18px; border-radius: 8px;
      font-weight: 700; font-size: 0.9rem; cursor: pointer; display: flex; gap: 8px; align-items: center;
    }
    /* ── Profile Dropdown ── */
    .profile-wrapper { position: relative; display: inline-block; }
    .profile-dropdown {
        position: absolute; top: 110%; right: 0; background: var(--osu-dark);
        border: 1px solid #333; border-radius: 12px; padding: 8px;
        box-shadow: 0 10px 25px rgba(0,0,0,0.5); opacity: 0; visibility: hidden;
        transform: translateY(-10px); transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); min-width: 160px; z-index: 100;
    }
    .profile-wrapper:hover .profile-dropdown, .profile-wrapper:focus-within .profile-dropdown {
        opacity: 1; visibility: visible; transform: translateY(0);
    }
    .dropdown-item {
        width: 100%; text-align: left; background: transparent; border: none;
        color: #ddd; padding: 10px 16px; border-radius: 8px; cursor: pointer;
        font-size: 0.95rem; font-weight: 600; font-family: var(--font-sf); transition: 0.2s;
        display: flex; gap: 10px; align-items: center;
    }
    .dropdown-item:hover { background: rgba(255,102,170,0.1); color: var(--osu-pink); }

    /* ── Footer Styling ── */
    .main-footer {
      width: 100%;
      padding: 30px 0;
      margin-top: auto;
      color: #666;
      font-size: 0.9rem;
    }

    .footer-content {
      max-width: 900px;
      margin: 0 auto;
      padding: 0 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .footer-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .footer-left .separator {
      color: #333;
    }

    .github-link {
      color: #888;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: 0.2s;
    }

    .github-link svg {
      width: 18px;
      height: 18px;
    }

    .github-link:hover {
      color: var(--osu-pink);
    }

    .version {
      background: #1a1a1a;
      padding: 2px 8px;
      border-radius: 4px;
    }

    /* Mobile Responsiveness */
    @media (max-width: 600px) {
      .footer-content {
        flex-direction: column;
        gap: 12px;
        text-align: center;
      }
    }
  </style>
</head>
<body>

      <div class="hero-left">

          <div class="mode-btn" onclick="openSizeModal('rush')">

  <div class="modal-overlay" id="sizeModal">
    <div class="size-modal" onclick="event.stopPropagation()">
      <h2 id="modalTitle">Select Grid Size</h2>
      
      <div class="size-grid" id="sizeGrid">
        </div>

      <div class="modal-buttons">
        <button class="modal-close-btn" onclick="closeSizeModal()">Cancel</button>
        <button class="btn-start" id="startGameBtn" disabled onclick="startGame()">Start Game</button>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="authModal" onclick="closeAuthModal()">
    <div class="auth-box" onclick="event.stopPropagation()">
      
      
      <div class="auth-tabs">
        <button class="auth-tab active" id="tabLogin" onclick="switchAuthTab('login')">Sign In</button>
        <button class="auth-tab" id="tabRegister" onclick="switchAuthTab('register')">Register</button>
      </div>
      
      <form id="loginForm" onsubmit="handleLogin(event)">
        <input type="text" id="loginUsername" class="auth-input" placeholder="Username" required>
        <input type="password" id="loginPassword" class="auth-input" placeholder="Password" required>
        <div id="loginError" class="auth-error"></div>
        <button type="submit" class="auth-submit">Sign In</button>
      </form>

      <form id="registerForm" onsubmit="handleRegister(event)" style="display: none;">
        <input type="text" id="regUsername" class="auth-input" placeholder="Choose Username" required>
        <input type="password" id="regPassword" class="auth-input" placeholder="Choose Password" required>
        <div id="regError" class="auth-error"></div>
        <button type="submit" class="auth-submit">Create Account</button>
      </form>
    </div>
  </div>

  <script>
    let selectedMode = null;
    let selectedSize = null;
    let currentUser = null;

    // 1. Check if the user is already logged in when the page loads
    async function checkAuth() {
        const res = await fetch('/api/me');
        const data = await res.json();
        if (data.logged_in) {
            updateAuthUI(data.username, data.money);
        }
    }

    // 2. Update the Top Nav Bar
    function updateAuthUI(username, money) {
        currentUser = username;
        
        // Inject the Dropdown Architecture
        const signinBtn = document.querySelector('.signin-btn');
        if (signinBtn) {
            signinBtn.outerHTML = `
            <div class="profile-wrapper">
              <button class="user-profile-btn">
                <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                ${username}
              </button>
              <div class="profile-dropdown">
                <button class="dropdown-item" onclick="logout()">
                  <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
                  Sign Out
                </button>
              </div>
            </div>`;
        }
        
        // Update the money badge
        document.getElementById('moneyDisplay').innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 8v8"/><path d="M14.5 9.5a2.5 2.5 0 0 0-5 0c0 1.38 5 1.12 5 2.5a2.5 2.5 0 0 1-5 0"/></svg> ${money}`;
        
        closeAuthModal();
    }

    // 3. Modal Controls
    function openAuthModal() { document.getElementById('authModal').classList.add('active'); }
    function closeAuthModal() { document.getElementById('authModal').classList.remove('active'); }
    function switchAuthTab(tab) {
        document.getElementById('tabLogin').classList.toggle('active', tab === 'login');
        document.getElementById('tabRegister').classList.toggle('active', tab === 'register');
        document.getElementById('loginForm').style.display = tab === 'login' ? 'block' : 'none';
        document.getElementById('registerForm').style.display = tab === 'register' ? 'block' : 'none';
        document.getElementById('loginError').textContent = '';
        document.getElementById('regError').textContent = '';
    }

    // Replace your old "alert('Sign in modal')" on the top button with the real function:
    document.querySelector('.signin-btn').onclick = openAuthModal;

    // 4. API Calls
    async function handleLogin(e) {
        e.preventDefault();
        const res = await fetch('/api/login', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username: loginUsername.value, password: loginPassword.value })
        });
        const data = await res.json();
        if (data.success) updateAuthUI(data.username, data.money);
        else document.getElementById('loginError').textContent = data.error;
    }

    async function handleRegister(e) {
        e.preventDefault();
        const res = await fetch('/api/register', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username: regUsername.value, password: regPassword.value })
        });
        const data = await res.json();
        if (data.success) updateAuthUI(data.username, data.money);
        else document.getElementById('regError').textContent = data.error;
    }

    async function logout() {
        await fetch('/api/logout', { method: 'POST' });
        window.location.reload(); // Quickest way to reset the UI to guest mode
    }

    // Run this the moment the page loads!
    checkAuth();

    function openSizeModal(mode) {
      selectedMode = mode;
      selectedSize = null;
      
      // Set title based on mode
      const titleMode = mode.charAt(0).toUpperCase() + mode.slice(1);
      document.getElementById('modalTitle').textContent = `${titleMode} Mode · Select Size`;
      
      // Generate size options 3x3 to 9x9
      const sizeGrid = document.getElementById('sizeGrid');
      sizeGrid.innerHTML = '';
      
      for (let s = 3; s <= 9; s++) {
        const option = document.createElement('div');
        option.className = 'size-option';
        option.textContent = `${s}×${s}`;
        option.onclick = () => {
          document.querySelectorAll('.size-option').forEach(o => o.classList.remove('selected'));
          option.classList.add('selected');
          selectedSize = s;
          document.getElementById('startGameBtn').disabled = false;
        };
        sizeGrid.appendChild(option);
      }
      
      document.getElementById('startGameBtn').disabled = true;
      document.getElementById('sizeModal').classList.add('active');
    }

    function closeSizeModal() {
      document.getElementById('sizeModal').classList.remove('active');
    }

    function startGame() {
      if (selectedMode && selectedSize) {
        // Pass both parameters to game.html
        if (selectedMode == "normal"){
          window.location.href = `game.html?size=${selectedSize}`;
        } else if(selectedMode == "rush"){
          window.location.href = `rush.html?size=${selectedSize}`;
        } 
      }
    }

    // Close modal when clicking background
    document.getElementById('sizeModal').addEventListener('click', closeSizeModal);
  </script>

</body>
</html>
