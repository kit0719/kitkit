<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KenKen · Systems Programming</title>
  <style>
    :root {
      --osu-pink: #ff66aa;
      --osu-dark: #1a1a1a;
      --osu-darker: #111111;
      --osu-text: #e1e1e1;
      --font-sf: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #0d0d0d;
      color: var(--osu-text);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      font-family: var(--font-sf);
      -webkit-font-smoothing: antialiased;
    }

    /* ── top navigation bar ── */
    .top-nav {
      width: 100%;
      max-width: 900px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 30px;
      gap: 16px;
    }
    .nav-left { display: flex; align-items: center; gap: 16px; }
    .signin-btn {
      background: transparent; border: 1px solid #444; color: #ddd;
      padding: 8px 18px; border-radius: 8px; cursor: pointer;
      font-weight: 600; font-size: 0.85rem; transition: 0.2s;
    }
    .signin-btn:hover { border-color: var(--osu-pink); color: var(--osu-pink); }
    .money-badge {
      font-size: 0.9rem; color: #00dfc0; background: #222;
      padding: 6px 16px; border-radius: 20px; display: flex;
      align-items: center; gap: 6px; font-weight: 600;
    }
    .money-badge svg { width: 18px; height: 18px; }

    .nav-right { display: flex; gap: 12px; }
    .nav-icon {
      position: relative; background: transparent; border: 1px solid #444;
      color: #ddd; width: 44px; height: 44px; border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; transition: 0.2s;
    }
    .nav-icon svg { width: 20px; height: 20px; }
    .nav-icon:hover { border-color: var(--osu-pink); color: var(--osu-pink); background: rgba(255, 102, 170, 0.1); }
    .nav-icon::after {
      content: attr(data-tooltip); position: absolute; bottom: -28px; left: 50%;
      transform: translateX(-50%); background: #333; color: #eee; padding: 4px 10px;
      border-radius: 6px; font-size: 0.75rem; white-space: nowrap; opacity: 0;
      pointer-events: none; transition: opacity 0.2s; z-index: 10;
    }
    .nav-icon:hover::after { opacity: 1; }

    /* ── main content ── */
    .main-content {
      flex: 1; display: flex; flex-direction: column; align-items: center;
      justify-content: center; width: 100%; max-width: 900px;
      padding: 0 20px; margin-top: -40px; text-align: center;
    }

    .logo { font-size: 4rem; font-weight: 700; color: #fff; margin-bottom: 12px; letter-spacing: -0.02em; }
    .logo span { color: var(--osu-pink); }
    .subtitle {
      font-size: 1.2rem; font-weight: 600; line-height: 1.4; color: #888;
      margin-bottom: 60px;
    }
    .subtitle strong { color: #fff; }

    .mode-buttons { display: flex; gap: 40px; flex-wrap: wrap; justify-content: center; }
    .mode-btn {
      width: 240px; height: 240px; border: 2px solid #333;
      background: rgba(26, 26, 26, 0.9); border-radius: 24px;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 16px; cursor: pointer; transition: all 0.3s ease;
      color: #fff; font-weight: 700; font-size: 1.4rem;
    }
    .mode-btn svg { width: 64px; height: 64px; }
    .mode-btn:hover {
      border-color: var(--osu-pink); transform: translateY(-6px);
      box-shadow: 0 12px 30px rgba(255, 102, 170, 0.3); color: var(--osu-pink);
    }

    /* ── modal ── */
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.7); backdrop-filter: blur(6px);
      display: flex; align-items: center; justify-content: center; z-index: 100;
      visibility: hidden; opacity: 0; transition: opacity 0.2s, visibility 0.2s;
    }
    .modal-overlay.active { visibility: visible; opacity: 1; }
    .size-modal {
      background: var(--osu-dark); border-radius: 24px; padding: 40px 30px;
      max-width: 500px; width: 90%; text-align: center;
      box-shadow: 0 20px 40px rgba(0,0,0,0.7); border-top: 4px solid var(--osu-pink);
    }
    .size-modal h2 { font-size: 1.5rem; margin-bottom: 30px; color: #fff; }
    .size-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 30px; }
    .size-option {
      aspect-ratio: 1 / 1; background: #222; border: 2px solid #333; border-radius: 16px;
      display: flex; align-items: center; justify-content: center; font-size: 1.4rem;
      font-weight: 700; color: #ddd; cursor: pointer; transition: all 0.2s;
    }
    .size-option:hover { border-color: var(--osu-pink); color: #fff; background: #2a2a2a; transform: scale(1.05); }
    .size-option.selected { border-color: var(--osu-pink); background: rgba(255, 102, 170, 0.2); color: var(--osu-pink); }
    .modal-close-btn {
      background: transparent; border: 1px solid #555; color: #aaa;
      padding: 10px 24px; border-radius: 12px; font-weight: 700; cursor: pointer; transition: 0.2s;
    }
    .modal-close-btn:hover { border-color: var(--osu-pink); color: var(--osu-pink); }
    .start-btn {
      background: var(--osu-pink); border: none; color: #000; font-weight: 700;
      font-size: 1.1rem; padding: 12px 36px; border-radius: 30px; cursor: pointer; transition: 0.2s; margin-left: 10px;
    }
    .start-btn:disabled { opacity: 0.3; cursor: not-allowed; }
  </style>
</head>
<body>

  <div class="top-nav">
    <div class="nav-left">
      <button class="signin-btn" onclick="alert('Sign in modal')">Sign In</button>
      <div class="money-badge">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"/><path d="M12 8v8"/><path d="M14.5 9.5a2.5 2.5 0 0 0-5 0c0 1.38 5 1.12 5 2.5a2.5 2.5 0 0 1-5 0"/>
        </svg>
        200
      </div>
    </div>
    <div class="nav-right">
      <button class="nav-icon" data-tooltip="Input Puzzle"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg></button>
      <button class="nav-icon" data-tooltip="Tutorial"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg></button>
      <button class="nav-icon" data-tooltip="Shop"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg></button>
      <button class="nav-icon" data-tooltip="Settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button>
      <button class="nav-icon" data-tooltip="Leaderboard" onclick="window.location.href='leaderboard.html'"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2H6v7c0 3.31 2.69 6 6 6s6-2.69 6-6V2z"/></svg></button>
    </div>
  </div>

  <div class="main-content">
    <div class="logo">Ken<span>Ken</span></div>
    <div class="subtitle"><strong>Logic, refined.</strong><br>Engineered for speed. Played by you.</div>

    <div class="mode-buttons">
      <div class="mode-btn normal" onclick="openSizeModal('normal')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
        <div>Normal Mode</div>
      </div>
      <div class="mode-btn rush" onclick="openSizeModal('rush')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2 2"/><path d="M12 2v2"/><path d="M10 2h4"/></svg>
        <div>Rush Mode</div>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="sizeModal">
    <div class="size-modal">
      <h2 id="modalTitle">Select Grid Size</h2>
      <div class="size-grid" id="sizeGrid"></div>
      <button class="modal-close-btn" onclick="closeSizeModal()">Cancel</button>
      <button class="start-btn" id="startGameBtn" disabled onclick="startGame()">Start</button>
    </div>
  </div>

  <script>
    let selectedMode = null, selectedSize = null;   
    function openSizeModal(mode) {
      selectedMode = mode; selectedSize = null;
      document.getElementById('modalTitle').textContent = mode === 'normal' ? 'Normal Mode - Select Grid Size' : 'Rush Mode - Select Grid Size';
      const sizeGrid = document.getElementById('sizeGrid');
      sizeGrid.innerHTML = '';
      for (let s = 3; s <= 9; s++) {
        const option = document.createElement('div');
        option.className = 'size-option'; option.textContent = s + '×' + s;
        option.addEventListener('click', function() {
          document.querySelectorAll('.size-option').forEach(o => o.classList.remove('selected'));
          option.classList.add('selected'); selectedSize = s;
          document.getElementById('startGameBtn').disabled = false;
        });
        sizeGrid.appendChild(option);
      }
      document.getElementById('startGameBtn').disabled = true;
      document.getElementById('sizeModal').classList.add('active');
    }
    function closeSizeModal() { document.getElementById('sizeModal').classList.remove('active'); }
    function startGame() { 
        if (selectedMode && selectedSize) {
            // Pass the size as a URL parameter!
            window.location.href = `game.html?size=${selectedSize}`; 
        }
    }
    document.getElementById('sizeModal').addEventListener('click', function(e) { if (e.target === this) closeSizeModal(); });
  </script>
</body>
</html>
